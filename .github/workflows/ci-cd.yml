name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PHP_VERSION: "8.2"
  IMAGE_NAME: dtavares99/oficina-mecanica-api

jobs:
  # ── 1. Build e Testes ─────────────────────────────────────────────
  test:
    name: Build & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: oficina_mecanica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oficina_mecanica_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, mbstring, openssl
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Generate JWT secret
        run: php artisan jwt:secret --force

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: oficina_mecanica_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: oficina_mecanica_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test

  # ── 2. Build Docker Image ─────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -f docker/Dockerfile .

      - name: Tag as latest
        run: docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Push Docker image
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

  # ── 3. Deploy Kubernetes ──────────────────────────────────────────
  deploy:
    name: Deploy to K8s
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inform Minikube Local Deployment
        if: ${{ secrets.KUBECONFIG == '' }}
        run: |
          echo "Deploy ignorado: O repositório não possui o secret KUBECONFIG configurado."
          echo "Como o projeto utiliza Minikube local, execute o deploy diretamente em sua máquina local."

      - name: Configure kubectl
        if: ${{ secrets.KUBECONFIG != '' }}
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config 2>/dev/null || echo "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update Image Tag in Manifest
        if: ${{ secrets.KUBECONFIG != '' }}
        run: |
          sed -i "s|image: .*oficina-mecanica-api:.*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/api-deployment.yaml

      - name: Apply K8s manifests
        if: ${{ secrets.KUBECONFIG != '' }}
        run: |
          # TODO: Futuramente, o secret.yaml deverá ser gerado dinamicamente a partir dos GitHub Secrets antes do apply.
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/postgres-service.yaml
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/api-service.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Wait for rollout
        if: ${{ secrets.KUBECONFIG != '' }}
        run: |
          kubectl rollout status deployment/oficina-postgres --timeout=120s || true
          kubectl rollout status deployment/oficina-api --timeout=300s
