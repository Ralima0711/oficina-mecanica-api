apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-mecanica-config
data:
  APP_ENV: "production"
  APP_URL: "http://oficina-mecanica-api-service"
  DB_CONNECTION: "pgsql"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_DATABASE: "oficina_mecanica"
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "debug"
  DEFAULT_USER_NAME: "admin"
  DEFAULT_USER_EMAIL: "admin@oficina.local"
  DEFAULT_USER_ROLE: "admin"
  L5_SWAGGER_USE_ABSOLUTE_PATH: "false"
